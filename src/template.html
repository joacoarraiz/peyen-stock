<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peyen · Control de stock por SKU</title>
<link rel="icon" href="__LOGO__">
<style>
  :root{
    --navy:#001F3C; --navy-soft:#0d3562; --red:#D52319; --red-soft:#fdecea;
    --ink:#12263a; --muted:#68788c; --line:#e2e8f0; --bg:#f4f6f9;
    --ok:#0f7b4f; --ok-soft:#e6f5ee; --warn:#8a5a00; --warn-soft:#fff5e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}

  /* ---------- header ---------- */
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;
         align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  header img{height:42px;background:#fff;border-radius:8px;padding:4px 8px}
  .htitle{font-size:18px;font-weight:700;letter-spacing:.2px}
  .hsub{font-size:12.5px;color:#a9bdd4}
  .hspace{flex:1}
  .btn{border:0;border-radius:8px;padding:9px 15px;font-weight:600;font-size:14px}
  .btn-primary{background:var(--red);color:#fff}
  .btn-primary:hover{background:#b81d14}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.22)}
  .btn-line{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn-line:hover{background:#eef2f7}
  .btn-sm{padding:5px 10px;font-size:13px;border-radius:6px}
  #saveState{font-size:12.5px;color:#a9bdd4;min-width:150px;text-align:right}
  #saveState.dirty{color:#ffd9a0}

  /* ---------- kpis ---------- */
  .kpis{display:flex;gap:12px;padding:16px 22px 0;flex-wrap:wrap}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;
       padding:10px 16px;min-width:130px;flex:1}
  .kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.2}
  .kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi.alert b{color:var(--red)}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;padding:16px 22px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:240px;padding:9px 12px;border:1px solid var(--line);
       border-radius:8px;background:#fff}
  .toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .chk{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);
       background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .chk input{margin:0}

  #alert{margin:0 22px 14px;background:var(--warn-soft);border:1px solid #f0d59a;
         border-radius:8px;padding:11px 15px;font-size:13.5px;color:var(--warn)}
  #alert[hidden]{display:none}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;padding:0 22px;margin-bottom:-1px}
  .tab{background:#e7ecf3;border:1px solid var(--line);border-bottom:0;color:var(--muted);
       padding:9px 18px;border-radius:9px 9px 0 0;font-weight:600;font-size:14px}
  .tab.on{background:#fff;color:var(--navy);box-shadow:0 -2px 0 var(--red) inset}

  /* ---------- tabla ---------- */
  .wrap{padding:0 22px 60px}
  .fis{width:92px;text-align:right;border:1px solid var(--line);border-radius:6px;
       padding:7px 9px;font-weight:700;font-size:16px;background:#fff;color:var(--navy)}
  .fis:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,31,60,.1)}
  tr.skurow td{border-bottom:1px solid #eef1f5}
  tr.skurow:hover{background:#f7f9fc}
  .rep{font-weight:700;color:var(--navy);text-align:right}
  .rep small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
  .desc{font-size:12px;color:var(--muted)}
  /* nada de overflow acá: un contenedor con scroll rompe el position:sticky del thead */
  table{width:100%;min-width:820px;border-collapse:collapse;background:#fff;border:1px solid var(--line);
        border-radius:10px}
  thead th{background:#eef2f7;color:var(--navy);font-size:11.5px;text-transform:uppercase;
           letter-spacing:.6px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);
           position:sticky;top:var(--th-top,72px);z-index:10}
  td{padding:7px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  tbody.grp{border-top:2px solid var(--navy)}
  tr.sku{background:#f7f9fc;cursor:pointer}
  tr.sku:hover{background:#eef3f9}
  tr.sku td{padding:11px 12px;font-weight:600}
  .caret{display:inline-block;width:14px;color:var(--muted);font-size:11px}
  .skuname{font-size:16px;color:var(--navy);letter-spacing:.2px}
  .total{font-size:21px;font-weight:700;color:var(--navy);text-align:right;white-space:nowrap}
  .total small{display:block;font-size:11px;font-weight:600;color:var(--warn)}
  .total.zero{color:var(--red)}
  tr.pub td:first-child{padding-left:30px}
  tr.pub.off{background:#fbfcfd;color:var(--muted)}
  tr.pub.off .t-in,tr.pub.off .mla{color:var(--muted)}

  .mla{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;width:150px;
       border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px}
  .t-in{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px}
  .mla:hover,.t-in:hover,.stk:hover{border-color:var(--line)}
  .mla:focus,.t-in:focus,.stk:focus{border-color:var(--navy);background:#fff;outline:none}
  .stk{width:78px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;
       font-weight:600;background:#fff}
  .est{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;font-size:13.5px}
  .est.on{color:var(--ok);background:var(--ok-soft);border-color:#bfe3d1}
  .est.off{color:var(--muted);background:#f1f4f8}

  .sum{width:18px;height:18px;accent-color:var(--navy);cursor:pointer}
  .sumcell{text-align:center}
  .chips{margin-top:2px;padding-left:6px}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:2px 7px;
        border-radius:20px;vertical-align:middle}
  .c-link{background:#e8eefb;color:#1e3f80}
  .c-warn{background:var(--warn-soft);color:var(--warn)}
  .c-combo{background:#f2ecfb;color:#5b3b96}
  .c-var{background:#eaf6ee;color:#1c6b3c}
  .c-zero{background:var(--red-soft);color:var(--red)}
  .c-full{background:var(--warn-soft);color:var(--warn)}
  .c-count{background:#eef2f7;color:var(--muted)}
  .del{background:transparent;border:0;color:#b9c4d1;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
  .del:hover{color:var(--red);background:var(--red-soft)}
  .hint{font-size:11.5px;color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot{display:flex;gap:10px;align-items:center;padding:16px 0}

  /* ---------- toast ---------- */
  /* ---------- login ---------- */
  #login{position:fixed;inset:0;background:var(--navy);z-index:100;display:flex;
         align-items:center;justify-content:center;padding:20px}
  #login[hidden]{display:none}
  .card{background:#fff;border-radius:14px;padding:34px 32px;width:min(380px,100%);
        box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
  .card img{height:56px;margin-bottom:18px}
  .card h1{font-size:17px;margin:0 0 4px;color:var(--navy)}
  .card p{margin:0 0 22px;font-size:13.5px;color:var(--muted)}
  .card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;
              font-size:16px;text-align:center;letter-spacing:1px;margin-bottom:12px}
  .card input:focus{outline:none;border-color:var(--navy)}
  .card button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--red);
               color:#fff;font-weight:700;font-size:15px}
  .card button:hover{background:#b81d14}
  .card .err{color:var(--red);font-size:13px;min-height:18px;margin:10px 0 0}
  body.locked{overflow:hidden}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
         background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;
         box-shadow:0 8px 24px rgba(0,31,60,.28);opacity:0;transition:.25s;z-index:60;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  @media print{header{position:static}.toolbar,.del,.foot,#toast{display:none}}
</style>
</head>
<body class="locked">

<div id="login">
  <form class="card" id="loginForm">
    <img src="__LOGO__" alt="Peyen">
    <h1>Control de stock</h1>
    <p>Ingresá la clave para ver la planilla</p>
    <input type="password" id="pass" placeholder="Clave" autocomplete="current-password" autofocus>
    <button type="submit" id="btnEntrar">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<header>
  <img src="__LOGO__" alt="Peyen">
  <div>
    <div class="htitle">Control de stock por SKU</div>
    <div class="hsub" id="hsub">Publicaciones de Mercado Libre</div>
  </div>
  <div class="hspace"></div>
  <span id="saveState">—</span>
  <button class="btn btn-primary" id="btnSave">Guardar cambios</button>
  <button class="btn btn-ghost" id="btnXlsx" title="Bajar la planilla en Excel para editarla ahí">Descargar Excel</button>
  <button class="btn btn-ghost" id="btnCargar" title="Subir un Excel editado o un export nuevo de Mercado Libre">Cargar Excel</button>
  <input type="file" id="fileXlsx" accept=".xlsx" hidden>
</header>

<div class="kpis">
  <div class="kpi"><b id="kSku">0</b><span>SKU</span></div>
  <div class="kpi"><b id="kPub">0</b><span>Publicaciones</span></div>
  <div class="kpi"><b id="kAct">0</b><span>Activas</span></div>
  <div class="kpi"><b id="kIna">0</b><span>Inactivas</span></div>
  <div class="kpi alert"><b id="kZero">0</b><span>Activas sin stock</span></div>
  <div class="kpi alert"><b id="kRev">0</b><span>SKU a revisar</span></div>
  <div class="kpi"><b id="kUni">0</b><span>Unidades totales</span></div>
</div>

<div class="toolbar">
  <input type="search" id="q" placeholder="Buscar por SKU, MLA o título…">
  <select id="fEstado">
    <option value="">Todos los estados</option>
    <option value="Activa">Solo activas</option>
    <option value="Inactiva">Solo inactivas</option>
  </select>
  <label class="chk"><input type="checkbox" id="fZero"> Sin stock</label>
  <label class="chk"><input type="checkbox" id="fMulti"> SKU con varias publicaciones</label>
  <label class="chk"><input type="checkbox" id="fRev"> Solo los que dicen REVISAR</label>
  <button class="btn btn-line" id="btnToggle">Contraer todo</button>
  <button class="btn btn-line" id="btnAddSku">+ Agregar SKU</button>
</div>

<div id="alert" hidden></div>

<div class="tabs">
  <button class="tab on" data-vista="pub">Por publicación</button>
  <button class="tab" data-vista="sku">Por SKU · cargar stock</button>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">
    <button class="btn btn-line" id="btnAddSku2">+ Agregar SKU</button>
    <span class="hint" id="shown"></span>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "peyen-stock-v1";
  var PASS_KEY = "peyen-pass";
  var API = "/api/stock";
  var state = null, collapsed = {}, allCollapsed = false, dirty = false;
  // "servidor" = la planilla está publicada y todos ven lo mismo.
  // "local"    = archivo suelto o portal: los cambios quedan en este navegador.
  var modo = "local", base = null, malaClave = false, vista = "pub";

  /* ---------- datos ---------- */
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var s = JSON.parse(raw); if(s && s.rows && s.rows.length) return s; }
    }catch(e){}
    return { rows: [], sku: {}, savedAt: null };   // los datos reales llegan del servidor
  }

  function n(v){ v = parseInt(v,10); return isNaN(v) ? 0 : v; }

  // Suma el stock de las publicaciones activas que tienen tildado "Suma".
  // El resto (inactivas o agrupadas por ML, que comparten la misma mercadería) queda aparte.
  function suma(r){ return r.cuenta !== false && r.estado === "Activa"; }

  function skuTotal(rows){
    var act = 0, fuera = 0, yaContado = {};
    rows.forEach(function(r){
      if(!suma(r)) return;
      act += n(r.stock) + n(r.full);
      if(r.link) yaContado[r.link] = true;
    });
    rows.forEach(function(r){
      // la copia de una publicación agrupada es la misma mercadería: no es stock aparte
      if(suma(r) || (r.link && yaContado[r.link])) return;
      fuera += n(r.stock) + n(r.full);
    });
    return { activo: act, fuera: fuera };
  }

  // Dos publicaciones que suman con el mismo número de stock suelen ser la misma
  // mercadería cargada dos veces: se marca para que la revisen.
  function revisar(rows){
    var v = rows.filter(suma).map(function(r){ return n(r.stock); });
    return v.some(function(x, i){ return x > 0 && v.indexOf(x) !== i; });
  }

  function bySku(rows){
    var order = [], map = {};
    rows.forEach(function(r){
      if(!map[r.sku]){ map[r.sku] = []; order.push(r.sku); }
      map[r.sku].push(r);
    });
    return order.map(function(s){ return { sku: s, rows: map[s] }; });
  }

  /* ---------- filtros ---------- */
  function filtered(){
    var q = document.getElementById("q").value.trim().toLowerCase();
    var est = document.getElementById("fEstado").value;
    var zero = document.getElementById("fZero").checked;
    var multi = document.getElementById("fMulti").checked;
    var rev = document.getElementById("fRev").checked;

    return bySku(state.rows).map(function(g){
      var rows = g.rows.filter(function(r){
        if(est && r.estado !== est) return false;
        if(zero && n(r.stock) + n(r.full) !== 0) return false;
        return true;
      });
      if(q){
        var hitSku = g.sku.toLowerCase().indexOf(q) >= 0;
        if(!hitSku) rows = rows.filter(function(r){
          return (r.mla || "").toLowerCase().indexOf(q) >= 0 ||
                 (r.title || "").toLowerCase().indexOf(q) >= 0;
        });
      }
      if(multi && g.rows.length < 2) rows = [];
      if(rev && !revisar(g.rows)) rows = [];
      return { sku: g.sku, rows: rows, all: g.rows };
    }).filter(function(g){ return g.rows.length; });
  }

  /* ---------- render ---------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function isCombo(sku){ return /\+/.test(sku); }

  /* ========== reparto de stock: el SKU manda, las publicaciones reciben ==========
     Peyen tiene N unidades de un SKU y lo publica en varias MLA. Poner N en cada
     publicación es prometer stock que no existe, así que el stock se REPARTE.
     Un combo consume una unidad de cada SKU que lo compone, por eso se lleva el
     mínimo entre lo que le tocó de cada parte: si una parte está en 0, el combo es 0. */

  // "COMBO FRI-2452 + KAN2036" -> ["FRI-2452","KAN2036"]. Devuelve null si alguna
  // parte no existe como SKU propio: sin ese dato el combo no se puede calcular.
  function partesDe(sku, universo){
    if(!isCombo(sku)) return null;
    var ps = sku.replace(/^\s*COMBO\s+/i, "").split("+")
                .map(function(p){ return p.trim(); }).filter(Boolean);
    if(ps.length < 2) return null;
    for(var i = 0; i < ps.length; i++) if(!universo[ps[i]]) return null;
    return ps;
  }

  // SKU "base": los que tienen stock físico propio. Un combo resoluble no es base,
  // porque su stock sale de sus partes.
  function universoSku(){
    var u = {};
    state.rows.forEach(function(r){ u[r.sku] = true; });
    return u;
  }

  // Cada grupo de publicaciones que comparte mercadería cuenta como UN consumidor.
  function consumidores(){
    var u = universoSku(), uso = {};
    var grupos = {};
    state.rows.forEach(function(r){
      if(r.estado !== "Activa") return;
      var g = r.sku + "||" + (r.link || r.id);
      if(grupos[g]) return;                  // publicaciones agrupadas: un consumidor
      grupos[g] = true;
      var ps = partesDe(r.sku, u) || [r.sku];
      ps.forEach(function(p){ (uso[p] = uso[p] || []).push(g); });
    });
    return { uso: uso, universo: u };
  }

  // Reparte el stock declarado de cada SKU entre las publicaciones que lo usan.
  function repartir(){
    var c = consumidores(), u = c.universo, uso = c.uso;

    // cuánto le toca a cada consumidor de cada SKU base
    var parte = {};
    Object.keys(uso).forEach(function(sku){
      var total = n(state.sku[sku]), cant = uso[sku].length;
      parte[sku] = cant ? Math.floor(total / cant) : 0;
    });

    var hechos = {};
    state.rows.forEach(function(r){
      if(r.estado !== "Activa") return;
      var ps = partesDe(r.sku, u);
      var v;
      if(ps){
        v = Math.min.apply(null, ps.map(function(p){ return parte[p] || 0; }));
      } else if(parte[r.sku] === undefined){
        return;                              // SKU sin stock declarado: no se toca
      } else {
        v = parte[r.sku];
      }
      var g = r.sku + "||" + (r.link || r.id);
      hechos[g] = v;
      r.stock = v;
    });
    // las publicaciones agrupadas comparten el número
    state.rows.forEach(function(r){
      var g = r.sku + "||" + (r.link || r.id);
      if(r.estado === "Activa" && hechos[g] !== undefined) r.stock = hechos[g];
    });
  }

  // Lo que hoy está publicado de un SKU base, para comparar contra lo declarado.
  function publicadoDe(sku){
    var c = consumidores(), u = c.universo, vistos = {}, t = 0;
    state.rows.forEach(function(r){
      if(r.estado !== "Activa") return;
      var g = r.sku + "||" + (r.link || r.id);
      if(vistos[g]) return;
      vistos[g] = true;
      var ps = partesDe(r.sku, u) || [r.sku];
      if(ps.indexOf(sku) >= 0) t += n(r.stock);
    });
    return t;
  }

  function linkedCount(all, r){
    if(!r.link) return 1;
    return all.filter(function(x){ return x.link === r.link; }).length;
  }

  function rowHTML(r, all){
    var shared = linkedCount(all, r) > 1;
    var off = r.estado !== "Activa";
    var chips = "";
    if(shared) chips += '<span class="chip c-link" title="Mercado Libre agrupa estas publicaciones: comparten la misma mercadería, por eso suman una sola vez">COMPARTE STOCK</span> ';
    if(r.variante) chips += '<span class="chip c-var" title="Es una variante dentro de la misma publicación">VARIANTE</span> ';
    if(n(r.full)) chips += '<span class="chip c-full">' + n(r.full) + ' EN FULL</span> ';
    if(!n(r.stock) && !n(r.full) && !off) chips += '<span class="chip c-zero">SIN STOCK</span> ';

    return '<tr class="pub' + (off ? " off" : "") + '" data-id="' + esc(r.id) + '">' +
      '<td><input class="mla" data-f="mla" value="' + esc(r.mla) + '" spellcheck="false"></td>' +
      '<td><input class="t-in" data-f="title" value="' + esc(r.title) + '">' +
        (chips ? '<div class="chips">' + chips + "</div>" : "") + "</td>" +
      '<td><select class="est ' + (off ? "off" : "on") + '" data-f="estado">' +
        '<option' + (off ? "" : " selected") + '>Activa</option>' +
        '<option' + (off ? " selected" : "") + '>Inactiva</option></select></td>' +
      '<td style="text-align:right"><input class="stk" data-f="stock" type="number" min="0" value="' + n(r.stock) + '"></td>' +
      '<td class="sumcell"><input class="sum" type="checkbox" data-f="cuenta"' +
        (r.cuenta !== false ? " checked" : "") +
        ' title="Destildala si esta publicación repite mercadería ya contada en otra"></td>' +
      '<td><button class="del" data-act="delRow" title="Eliminar publicación">✕</button></td></tr>';
  }

  function totalHTML(t){
    return t.activo + (t.fuera ? '<small>' + t.fuera + " sin sumar</small>" : "");
  }

  function chipsHTML(sku, all){
    var act = all.filter(function(r){ return r.estado === "Activa"; }).length;
    var chips = '<span class="chip c-count">' + all.length +
                (all.length === 1 ? " publicación" : " publicaciones") +
                " · " + act + " activa" + (act === 1 ? "" : "s") + "</span> ";
    if(isCombo(sku)) chips += '<span class="chip c-combo" title="El SKU combina más de un producto">COMBO</span> ';
    if(revisar(all)) chips += '<span class="chip c-warn" title="Hay dos publicaciones que suman con el mismo stock: puede ser la misma mercadería contada dos veces">REVISAR</span> ';
    return chips;
  }

  function groupHTML(g){
    var t = skuTotal(g.all);
    var open = !collapsed[g.sku];

    var h = '<tbody class="grp" data-sku="' + esc(g.sku) + '">' +
      '<tr class="sku" data-act="toggle">' +
        '<td><span class="caret">' + (open ? "▼" : "►") + '</span> <span class="skuname">' + esc(g.sku || "(sin SKU)") + '</span></td>' +
        '<td data-chips>' + chipsHTML(g.sku, g.all) + "</td>" +
        '<td class="hint">Stock del SKU</td>' +
        '<td class="total' + (t.activo ? "" : " zero") + '" data-total>' + totalHTML(t) + "</td>" +
        '<td><button class="btn btn-line btn-sm" data-act="addRow">+ Publicación</button></td>' +
        '<td><button class="del" data-act="delSku" title="Eliminar SKU completo">✕</button></td>' +
      "</tr>";
    if(open) g.rows.forEach(function(r){ h += rowHTML(r, g.all); });
    return h + "</tbody>";
  }

  // Arranca el stock declarado con lo que hoy está publicado, para no empezar en cero.
  function asegurarSku(){
    if(!state.sku) state.sku = {};
    var u = universoSku();
    Object.keys(u).forEach(function(sku){
      if(partesDe(sku, u)) return;                       // los combos se calculan
      if(state.sku[sku] === undefined) state.sku[sku] = publicadoDe(sku);
    });
  }

  function renderSku(){
    var u = universoSku(), c = consumidores(), uso = c.uso;
    var q = document.getElementById("q").value.trim().toLowerCase();
    var lista = Object.keys(u).filter(function(s){ return !q || s.toLowerCase().indexOf(q) >= 0; });
    var bases = lista.filter(function(s){ return !partesDe(s, u); }).sort(natCmp);
    var combos = lista.filter(function(s){ return !!partesDe(s, u); }).sort(natCmp);

    var h = '<table><thead><tr><th>SKU</th><th>Publicaciones que lo usan</th>' +
      '<th style="text-align:right">Stock físico</th>' +
      '<th style="text-align:right">Repartido</th><th></th></tr></thead><tbody>';

    bases.forEach(function(sku){
      var cant = (uso[sku] || []).length, pub = publicadoDe(sku), fis = n(state.sku[sku]);
      var sobra = fis - pub;
      h += '<tr class="skurow" data-sku="' + esc(sku) + '">' +
        '<td><span class="skuname">' + esc(sku) + "</span></td>" +
        '<td class="desc">' + (cant ? cant + (cant === 1 ? " publicación activa" : " publicaciones activas") +
            " · le toca " + Math.floor(fis / cant) + " a cada una"
          : '<span class="chip c-zero">SIN PUBLICACIONES ACTIVAS</span>') + "</td>" +
        '<td style="text-align:right"><input class="fis" type="number" min="0" data-sku-stock value="' + fis + '"></td>' +
        '<td class="rep" data-rep>' + pub +
          (sobra > 0 ? "<small>sobran " + sobra + "</small>" : "") + "</td>" +
        '<td class="desc">' + (cant ? "" : "cargá stock igual, se reparte cuando actives alguna") + "</td></tr>";
    });

    if(combos.length){
      h += '<tr><td colspan="5" style="background:#f7f9fc;padding:12px 12px 8px">' +
        '<b style="color:var(--navy)">Combos</b> <span class="desc">— no se cargan a mano: ' +
        "se calculan con el mínimo entre sus partes, así que si una parte queda en 0 el combo queda en 0.</span></td></tr>";
      combos.forEach(function(sku){
        var ps = partesDe(sku, u), cant = 0, vistos = {};
        state.rows.forEach(function(r){
          if(r.sku === sku && r.estado === "Activa"){
            var g = r.link || r.id; if(!vistos[g]){ vistos[g] = 1; cant++; }
          }
        });
        var valores = ps.map(function(p){
          var k = (uso[p] || []).length;
          return k ? Math.floor(n(state.sku[p]) / k) : 0;
        });
        h += '<tr class="skurow" data-sku="' + esc(sku) + '">' +
          '<td><span class="skuname">' + esc(sku) + '</span> <span class="chip c-combo">COMBO</span></td>' +
          '<td class="desc">' + ps.map(function(p, i){
              return esc(p) + " (" + valores[i] + ")";
            }).join(" + ") + " · " + cant + (cant === 1 ? " publicación" : " publicaciones") + "</td>" +
          '<td class="desc" style="text-align:right">se calcula</td>' +
          '<td class="rep" data-rep>' + Math.min.apply(null, valores) + "</td><td></td></tr>";
      });
    }

    h += "</tbody></table>";
    document.getElementById("app").innerHTML = h;
    document.getElementById("shown").textContent =
      bases.length + " SKU con stock propio · " + combos.length + " combos calculados";
    kpis();
  }

  function render(){
    if(vista === "sku"){ asegurarSku(); renderSku(); return; }
    var gs = filtered();
    var head = '<table><thead><tr>' +
      "<th>SKU / Publicación</th><th>Título</th><th>Estado</th>" +
      '<th style="text-align:right">Stock</th><th class="sumcell">Suma</th><th></th></tr></thead>';
    document.getElementById("app").innerHTML = gs.length
      ? head + gs.map(groupHTML).join("") + "</table>"
      : '<div class="empty">No hay resultados con esos filtros.</div>';
    document.getElementById("shown").textContent =
      gs.length + " SKU visibles de " + bySku(state.rows).length;
    kpis();
  }

  function kpis(){
    var rows = state.rows, gs = bySku(rows);
    var act = rows.filter(function(r){ return r.estado === "Activa"; });
    var uni = gs.reduce(function(s,g){ return s + skuTotal(g.rows).activo; }, 0);
    set("kSku", gs.length);
    set("kPub", rows.length);
    set("kAct", act.length);
    set("kIna", rows.length - act.length);
    set("kZero", act.filter(function(r){ return !n(r.stock) && !n(r.full); }).length);
    set("kRev", gs.filter(function(g){ return revisar(g.rows); }).length);
    set("kUni", uni.toLocaleString("es-AR"));
  }
  function set(id, v){ document.getElementById(id).textContent = v; }

  // Actualiza el total de un grupo sin re-renderizar (no pierde el foco del input)
  function refreshSku(sku){
    var sel = window.CSS && CSS.escape ? CSS.escape(sku) : sku;
    var tb = document.querySelector('tbody[data-sku="' + sel + '"]');
    var all = state.rows.filter(function(r){ return r.sku === sku; });
    var t = skuTotal(all);
    if(tb){
      var cell = tb.querySelector("[data-total]");
      cell.innerHTML = totalHTML(t);
      cell.className = "total" + (t.activo ? "" : " zero");
      tb.querySelector("[data-chips]").innerHTML = chipsHTML(sku, all);
    }
    kpis();
  }

  /* ---------- edición ---------- */
  function find(id){ return state.rows.filter(function(r){ return r.id === id; })[0]; }

  function markDirty(){
    dirty = true;
    var el = document.getElementById("saveState");
    el.textContent = "Cambios sin guardar";
    el.className = "dirty";
  }

  document.getElementById("app").addEventListener("input", function(e){
    // vista por SKU: cargan el stock físico y se reparte solo entre las publicaciones
    var fis = e.target.closest("[data-sku-stock]");
    if(fis){
      var fila = e.target.closest("tr.skurow");
      var quien = fila.dataset.sku;
      state.sku[quien] = n(fis.value);
      repartir();
      // se redibuja entero (un SKU afecta a los combos que lo usan) y se devuelve el foco
      renderSku();
      var otra = document.querySelector('tr.skurow[data-sku="' +
        (window.CSS && CSS.escape ? CSS.escape(quien) : quien) + '"] [data-sku-stock]');
      if(otra){ otra.focus(); otra.setSelectionRange(otra.value.length, otra.value.length); }
      markDirty();
      return;
    }

    var inp = e.target.closest("input,select"); if(!inp || !inp.dataset.f) return;
    var tr = e.target.closest("tr.pub"); if(!tr) return;
    var r = find(tr.dataset.id); if(!r) return;
    var f = inp.dataset.f;

    if(f === "stock"){
      r.stock = n(inp.value);
      // las publicaciones agrupadas comparten mercadería: replico el número
      if(r.link) state.rows.forEach(function(x){
        if(x !== r && x.link === r.link && x.sku === r.sku){
          x.stock = r.stock;
          var o = document.querySelector('tr.pub[data-id="' + x.id + '"] .stk');
          if(o) o.value = r.stock;
        }
      });
      refreshSku(r.sku);
    } else if(f === "cuenta"){
      r.cuenta = inp.checked;
      refreshSku(r.sku);
    } else {
      r[f] = inp.value;
    }
    markDirty();
  });

  document.getElementById("app").addEventListener("change", function(e){
    var sel = e.target.closest("select[data-f=estado]"); if(!sel) return;
    var tr = e.target.closest("tr.pub");
    var r = find(tr.dataset.id); if(!r) return;
    r.estado = sel.value;
    sel.className = "est " + (r.estado === "Activa" ? "on" : "off");
    tr.classList.toggle("off", r.estado !== "Activa");
    refreshSku(r.sku);
    markDirty();
  });

  document.getElementById("app").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b) return;
    var tb = e.target.closest("tbody"); var sku = tb ? tb.dataset.sku : null;
    var act = b.dataset.act;

    if(act === "toggle"){
      if(e.target.closest("[data-act=addRow],[data-act=delSku]")) return;
      collapsed[sku] = !collapsed[sku]; render(); return;
    }
    if(act === "addRow"){
      collapsed[sku] = false;
      state.rows.push(newRow(sku)); markDirty(); render(); return;
    }
    if(act === "delSku"){
      var count = state.rows.filter(function(r){ return r.sku === sku; }).length;
      if(!confirm("¿Eliminar el SKU " + sku + " y sus " + count + " publicaciones?")) return;
      state.rows = state.rows.filter(function(r){ return r.sku !== sku; });
      markDirty(); render(); return;
    }
    if(act === "delRow"){
      var tr = e.target.closest("tr.pub");
      var r = find(tr.dataset.id);
      if(!confirm("¿Eliminar la publicación " + (r.mla || "nueva") + "?")) return;
      state.rows = state.rows.filter(function(x){ return x.id !== r.id; });
      markDirty(); render(); return;
    }
  });

  function newRow(sku){
    return { id: "n" + Date.now() + Math.random().toString(36).slice(2,6),
             sku: sku, mla: "", title: "", stock: 0, full: 0,
             estado: "Activa", link: "", variante: false, cuenta: true };
  }

  function addSku(){
    var sku = prompt("Nuevo SKU:");
    if(!sku) return;
    sku = sku.trim();
    if(state.rows.some(function(r){ return r.sku === sku; })){
      toast("Ese SKU ya está en la lista"); return;
    }
    state.rows.push(newRow(sku));
    markDirty();
    // los filtros pueden estar escondiendo el SKU recién creado
    document.getElementById("q").value = "";
    document.getElementById("fEstado").value = "";
    ["fZero","fMulti","fRev"].forEach(function(id){ document.getElementById(id).checked = false; });
    collapsed[sku] = false;
    render();
    var tb = document.querySelector('tbody[data-sku="' + (window.CSS && CSS.escape ? CSS.escape(sku) : sku) + '"]');
    if(tb){
      tb.scrollIntoView({ behavior: "smooth", block: "center" });
      var t = tb.querySelector("tr.pub .t-in");
      if(t){ t.focus(); }
      toast("Completá título, MLA y stock en la fila nueva");
    }
  }

  /* ---------- guardar ---------- */
  function stamp(iso){
    var d = new Date(iso || state.savedAt);
    return d.toLocaleDateString("es-AR") + " " +
           d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  }

  function setState(txt, cls){
    var el = document.getElementById("saveState");
    el.textContent = txt;
    el.className = cls || "";
    document.getElementById("hsub").textContent = state && state.savedAt
      ? "Última actualización: " + stamp()
      : "Publicaciones de Mercado Libre";
  }

  function saveLocal(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch(err){ return false; }
  }

  // Guardar = dejarlo en el servidor si la planilla está publicada en Netlify.
  // Si no hay servidor (archivo suelto o portal), queda en este navegador.
  function save(){
    state.savedAt = new Date().toISOString();
    var local = saveLocal();
    if(modo !== "servidor"){
      dirty = false;
      if(local){ setState("Guardado en este navegador · " + stamp()); toast("Cambios guardados en este navegador"); }
      else { setState("No se pudo guardar", "dirty"); toast("Este navegador no deja guardar. Usá «Descargar copia»."); }
      return local;
    }
    empujar();
    return true;
  }

  // pisar = el savedAt que el servidor reportó en el conflicto. Mandarlo como base
  // es decirle "sé que hay una versión más nueva y la reemplazo", y corta ahí.
  function empujar(pisar){
    setState("Guardando…");
    api("PUT", { rows: state.rows, sku: state.sku || {}, base: pisar || base })
      .then(function(res){
        if(res.status === 409){
          res.json().then(function(d){
            if(confirm("Otra persona guardó cambios el " + stamp(d.savedAt) + ", después de que abriste esta planilla.\n\n" +
                       "Aceptar: pisar lo de esa persona con lo tuyo.\n" +
                       "Cancelar: descartar lo tuyo y traer lo del servidor.")){
              empujar(d.savedAt);
            } else {
              traer(true);
            }
          });
          return;
        }
        if(res.status === 401){ volverAlLogin("La clave cambió. Volvé a entrar."); return; }
        if(!res.ok) throw new Error(res.status);
        return res.json().then(function(d){
          base = d.savedAt;
          state.savedAt = d.savedAt;
          dirty = false;
          saveLocal();
          aviso(false);
          setState("Guardado para todos · " + stamp());
          toast("Guardado en el servidor: ya lo ven los dos");
        });
      })
      .catch(function(){
        setState("Sin conexión · guardado acá", "dirty");
        toast("No hubo conexión con el servidor. Quedó guardado en este navegador.");
      });
  }

  // Trae lo que hay en el servidor. adoptar=true pisa lo que tengas en pantalla.
  function traer(adoptar){
    return api("GET").then(function(res){
      if(res.status === 401){ malaClave = true; throw new Error("clave"); }
      malaClave = false;
      if(!res.ok) throw new Error(res.status);
      var ct = res.headers.get("content-type") || "";
      if(ct.indexOf("json") < 0) throw new Error("sin api");
      return res.json().then(function(d){
        modo = "servidor";
        if(!d || !d.rows){                       // servidor vacío: subo lo que tengo
          setState("Sin datos en el servidor");
          return;
        }
        if(d.savedAt === base && !adoptar) return;
        if(dirty && !adoptar){ aviso(true, d.savedAt); return; }
        var venia = base;
        base = d.savedAt;
        state = { rows: d.rows, sku: d.sku || {}, savedAt: d.savedAt };
        dirty = false;
        aviso(false);
        render();
        setState("Guardado para todos · " + stamp());
        // si ya tenía datos cargados, los números cambiaron solos: hay que avisar
        if(venia) toast("Actualizado: otra persona guardó cambios" + (d.editor ? " (" + d.editor + ")" : ""));
      });
    });
  }

  function aviso(mostrar, cuando){
    var el = document.getElementById("alert");
    el.hidden = !mostrar;
    if(mostrar) el.innerHTML = "<b>Ojo:</b> otra persona guardó cambios el " + stamp(cuando) +
      " y vos tenés ediciones sin guardar. Si guardás, te va a preguntar cuál versión queda.";
  }

  function api(method, body){
    var h = { "content-type": "application/json" };
    var clave = localStorage.getItem(PASS_KEY);
    if(clave) h["x-peyen-pass"] = clave;
    return fetch(API, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined });
  }

  function volverAlLogin(motivo){
    try{ localStorage.removeItem(PASS_KEY); }catch(e){}
    document.getElementById("loginErr").textContent = motivo || "";
    document.getElementById("login").hidden = false;
    document.body.classList.add("locked");
    document.getElementById("pass").focus();
  }


  /* ================= EXCEL =================
     Sin librerías: un .xlsx es un ZIP con XML adentro. Para escribir se arma el ZIP
     con entradas STORED (sin comprimir), y para leer se usa DecompressionStream, que
     ya viene en el navegador. Así la planilla no depende de ningún CDN. */

  var CRC = (function(){
    var t = new Uint32Array(256);
    for(var n = 0; n < 256; n++){
      var c = n;
      for(var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return function(b){
      var c = 0xFFFFFFFF;
      for(var i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    };
  })();

  function zip(files){
    var enc = new TextEncoder(), parts = [], central = [], offset = 0;
    var u16 = function(n){ return [n & 255, (n >> 8) & 255]; };
    var u32 = function(n){ return [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]; };
    files.forEach(function(f){
      var nm = enc.encode(f[0]), data = enc.encode(f[1]), crc = CRC(data);
      var head = [].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(data.length), u32(data.length), u16(nm.length), u16(0));
      parts.push(new Uint8Array(head), nm, data);
      // ojo: push de UN par, no de dos elementos sueltos
      central.push([[].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(data.length), u32(data.length), u16(nm.length),
        u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)), nm]);
      offset += head.length + nm.length + data.length;
    });
    var cd = [];
    central.forEach(function(c){ cd.push(new Uint8Array(c[0]), c[1]); });
    var cdSize = cd.reduce(function(a, x){ return a + x.length; }, 0);
    var end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0),
      u16(files.length), u16(files.length), u32(cdSize), u32(offset), u16(0)));
    return new Blob(parts.concat(cd, [end]),
      { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  function xesc(s){
    return String(s).replace(/[&<>]/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    }).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  }

  function colName(i){
    var s = "", n = i + 1;
    while(n){ s = String.fromCharCode(65 + (n - 1) % 26) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  function sheetXML(filas){
    var body = filas.map(function(r, ri){
      return '<row r="' + (ri + 1) + '">' + r.map(function(v, ci){
        var ref = colName(ci) + (ri + 1);
        if(typeof v === "number")
          return '<c r="' + ref + '" s="' + (ri ? 0 : 1) + '"><v>' + v + "</v></c>";
        return '<c r="' + ref + '" t="inlineStr" s="' + (ri ? 0 : 1) + '"><is><t xml:space="preserve">' +
               xesc(v) + "</t></is></c>";
      }).join("") + "</row>";
    }).join("");
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<cols><col min="1" max="1" width="20"/><col min="2" max="2" width="16"/>' +
      '<col min="3" max="3" width="64"/><col min="4" max="7" width="12"/></cols>' +
      "<sheetData>" + body + "</sheetData></worksheet>";
  }

  function buildXlsx(filas){
    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF001F3C"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFill="1" applyFont="1"/>' +
      "</cellXfs></styleSheet>";
    return zip([
      ["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        "</Types>"],
      ["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        "</Relationships>"],
      ["xl/workbook.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<sheets><sheet name="Stock" sheetId="1" r:id="rId1"/></sheets></workbook>'],
      ["xl/_rels/workbook.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        "</Relationships>"],
      ["xl/styles.xml", styles],
      ["xl/worksheets/sheet1.xml", sheetXML(filas)]
    ]);
  }

  var COLS = ["SKU", "MLA", "Titulo", "Estado", "Stock", "Suma al total"];

  function bajarExcel(){
    var filas = [COLS];
    bySku(state.rows).forEach(function(g){
      g.rows.forEach(function(r){
        filas.push([r.sku, r.mla, r.title, r.estado, n(r.stock),
                    r.cuenta !== false ? "Si" : "No"]);
      });
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(buildXlsx(filas));
    a.download = "peyen-stock-" + new Date().toISOString().slice(0,10) + ".xlsx";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast("Planilla descargada. Editala y volvé con «Cargar Excel».");
  }

  /* ---------- lectura ---------- */
  function unzip(buf){
    var dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
    var eocd = -1, tope = Math.max(0, u8.length - 66000);
    for(var i = u8.length - 22; i >= tope; i--){
      if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error("El archivo no parece un Excel (.xlsx)");
    var cant = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true), out = {};
    for(var k = 0; k < cant; k++){
      if(dv.getUint32(p, true) !== 0x02014b50) throw new Error("Excel dañado");
      var nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true),
          cmtLen = dv.getUint16(p + 32, true), method = dv.getUint16(p + 10, true),
          cSize = dv.getUint32(p + 20, true), lho = dv.getUint32(p + 42, true);
      var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      // el header local repite nombre y extra, con largos propios
      var start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      out[name] = { method: method, data: u8.subarray(start, start + cSize) };
      p += 46 + nameLen + extraLen + cmtLen;
    }
    return out;
  }

  function textoDe(e){
    if(!e) return Promise.resolve("");
    if(e.method === 0) return Promise.resolve(new TextDecoder().decode(e.data));
    if(typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Este navegador no puede abrir el Excel. Probá con Chrome o Edge."));
    return new Response(
      new Blob([e.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))
    ).text();
  }

  function unxml(s){
    return s.replace(/&#(\d+);/g, function(_, d){ return String.fromCharCode(+d); })
            .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  }

  function textos(frag){
    return (frag.match(/<t[^>]*>[\s\S]*?<\/t>/g) || [])
      .map(function(x){ return unxml(x.replace(/<[^>]+>/g, "")); }).join("");
  }

  function colIdx(letras){
    var n = 0;
    for(var i = 0; i < letras.length; i++) n = n * 26 + (letras.charCodeAt(i) - 64);
    return n - 1;
  }

  function leerHoja(xml, shared){
    var filas = [], rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g, m;
    while((m = rowRe.exec(xml))){
      var arr = [], cellRe = /<c([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, c;
      while((c = cellRe.exec(m[1]))){
        var attrs = c[1], inner = c[2] || "";
        var ref = (attrs.match(/r="([A-Z]+)/) || [])[1];
        var t = (attrs.match(/t="([^"]+)"/) || [])[1];
        var v;
        if(t === "inlineStr"){ v = textos(inner); }
        else {
          var vm = inner.match(/<v[^>]*>([\s\S]*?)<\/v>/);
          v = vm ? unxml(vm[1]) : "";
          if(t === "s") v = shared[+v] || "";
        }
        if(ref) arr[colIdx(ref)] = v;
      }
      filas.push(arr);
    }
    return filas;
  }

  function normal(s){
    return String(s == null ? "" : s).trim().toUpperCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  // Reconoce las dos planillas que puede subir: la que baja de acá y el export de ML.
  function detectar(filas){
    for(var i = 0; i < Math.min(filas.length, 12); i++){
      var h = (filas[i] || []).map(normal);
      if(h.indexOf("ITEM_ID") >= 0) return { tipo: "ml", head: i, h: h };
      if(h.indexOf("MLA") >= 0 && h.indexOf("SKU") >= 0) return { tipo: "planilla", head: i, h: h };
    }
    return null;
  }

  function col(h, nombres){
    for(var i = 0; i < nombres.length; i++){
      var k = h.indexOf(normal(nombres[i]));
      if(k >= 0) return k;
    }
    return -1;
  }

  // Orden natural: 9090/A antes que 12039/A, y K-7806 pegado a K-7806/S.
  function natCmp(a, b){
    var A = String(a).split(/(\d+)/), B = String(b).split(/(\d+)/);
    for(var i = 0; i < Math.max(A.length, B.length); i++){
      var x = A[i], y = B[i];
      if(x === undefined) return -1;
      if(y === undefined) return 1;
      if(/^\d+$/.test(x) && /^\d+$/.test(y)){
        if(+x !== +y) return +x - +y;
      } else {
        x = x.toLowerCase(); y = y.toLowerCase();
        if(x !== y) return x < y ? -1 : 1;
      }
    }
    return 0;
  }

  // Export de Mercado Libre: mismas reglas que src/build.py.
  function filasDeML(filas, d){
    var h = d.h;
    var cFam = col(h, ["FAMILY_ID"]), cMla = col(h, ["ITEM_ID"]), cVar = col(h, ["VARIATION_ID"]),
        cSku = col(h, ["SKU"]), cTit = col(h, ["TITLE"]), cStk = col(h, ["STOCK_FLEX"]),
        cFull = col(h, ["STOCK_FULL"]), cEst = col(h, ["STATUS"]);
    if(cMla < 0 || cSku < 0) throw new Error("Al Excel de Mercado Libre le faltan columnas");

    var datos = filas.slice(d.head + 1).filter(function(r){
      return r && /^MLA\d+/.test(String(r[cMla] || "").trim());
    });
    var estadoDe = {};
    datos.forEach(function(r){
      var e = String(r[cEst] || "").trim();
      if(e) estadoDe[String(r[cMla]).trim()] = e;
    });

    var out = [];
    datos.forEach(function(r){
      var sku = String(r[cSku] || "").trim();
      // la fila madre de una publicación con variantes viene sin SKU y su stock ya
      // es la suma de las variantes: contarla sería duplicar
      if(!sku) return;
      var mla = String(r[cMla]).trim(), vari = String(cVar >= 0 ? r[cVar] || "" : "").trim();
      out.push({
        id: vari ? mla + "-" + vari : mla,
        sku: sku, mla: mla,
        title: String(r[cTit] || "").trim(),
        stock: n(r[cStk]), full: n(r[cFull]),
        estado: (String(r[cEst] || "").trim() || estadoDe[mla]) === "Activa" ? "Activa" : "Inactiva",
        link: cFam >= 0 ? String(r[cFam] || "").trim() : "",
        variante: !!vari
      });
    });

    // Mismo orden que src/build.py: así la publicación que suma es siempre la misma,
    // se hayan cargado los datos desde el build o desde este Excel.
    out.sort(function(a, b){ return natCmp(a.sku, b.sku) || (a.mla < b.mla ? -1 : a.mla > b.mla ? 1 : 0); });

    // de cada grupo que ML agrupa (mismo SKU + misma familia) suma uno solo
    var vistos = {};
    out.forEach(function(r){
      var k = r.sku + "||" + r.link;
      r.cuenta = !(r.link && vistos[k]);
      vistos[k] = true;
    });
    return out;
  }

  // La planilla que baja de acá: se respeta lo que el usuario editó en Excel y se
  // conserva lo que Excel no muestra (agrupación, Full, variantes).
  function filasDePlanilla(filas, d){
    var h = d.h;
    var cSku = col(h, ["SKU"]), cMla = col(h, ["MLA"]), cTit = col(h, ["TITULO"]),
        cEst = col(h, ["ESTADO"]), cStk = col(h, ["STOCK"]), cSum = col(h, ["SUMA AL TOTAL", "SUMA"]);
    var previo = {};
    state.rows.forEach(function(r){ previo[r.mla + "||" + r.sku] = r; });

    var out = [];
    filas.slice(d.head + 1).forEach(function(r){
      if(!r) return;
      var mla = String(r[cMla] || "").trim(), sku = String(r[cSku] || "").trim();
      if(!mla && !sku) return;
      var viejo = previo[mla + "||" + sku];
      var si = normal(cSum >= 0 ? r[cSum] : "SI");
      out.push({
        id: viejo ? viejo.id : "x" + mla + sku,
        sku: sku, mla: mla,
        title: cTit >= 0 ? String(r[cTit] || "").trim() : (viejo ? viejo.title : ""),
        stock: cStk >= 0 ? n(r[cStk]) : (viejo ? n(viejo.stock) : 0),
        full: viejo ? n(viejo.full) : 0,
        estado: normal(cEst >= 0 ? r[cEst] : "") === "INACTIVA" ? "Inactiva" : "Activa",
        link: viejo ? viejo.link : "",
        variante: viejo ? !!viejo.variante : false,
        cuenta: !(si === "NO" || si === "N" || si === "0" || si === "FALSE")
      });
    });
    return out;
  }

  function cargarExcel(file){
    toast("Leyendo " + file.name + "…");
    file.arrayBuffer().then(function(buf){
      var z = unzip(buf);
      var hojas = Object.keys(z).filter(function(k){ return /^xl\/worksheets\/.*\.xml$/.test(k); });
      if(!hojas.length) throw new Error("El Excel no tiene ninguna hoja");
      return textoDe(z["xl/sharedStrings.xml"]).then(function(ss){
        var shared = (ss.match(/<si>[\s\S]*?<\/si>/g) || []).map(textos);
        // se prueban todas las hojas y se usa la primera que tenga encabezados conocidos
        return hojas.reduce(function(prev, nombre){
          return prev.then(function(hecho){
            if(hecho) return hecho;
            return textoDe(z[nombre]).then(function(xml){
              var filas = leerHoja(xml, shared), d = detectar(filas);
              return d ? { filas: filas, d: d } : null;
            });
          });
        }, Promise.resolve(null));
      });
    }).then(function(hit){
      if(!hit) throw new Error("No reconocí las columnas. Subí la planilla que baja de acá, o el Excel de Publicaciones de Mercado Libre.");
      var nuevas = hit.d.tipo === "ml" ? filasDeML(hit.filas, hit.d) : filasDePlanilla(hit.filas, hit.d);
      if(!nuevas.length) throw new Error("El Excel no traía ninguna publicación");
      aplicarImport(nuevas, hit.d.tipo);
    }).catch(function(err){
      alert("No se pudo cargar el Excel.\n\n" + (err.message || err));
    });
  }

  function aplicarImport(nuevas, tipo){
    var antes = {}, ahora = {};
    state.rows.forEach(function(r){ antes[r.mla + "||" + r.sku] = r; });
    nuevas.forEach(function(r){ ahora[r.mla + "||" + r.sku] = r; });
    var agregadas = nuevas.filter(function(r){ return !antes[r.mla + "||" + r.sku]; }).length;
    var quitadas = state.rows.filter(function(r){ return !ahora[r.mla + "||" + r.sku]; });
    var cambiadas = nuevas.filter(function(r){
      var v = antes[r.mla + "||" + r.sku];
      return v && (n(v.stock) !== n(r.stock) || v.estado !== r.estado || (v.cuenta !== false) !== (r.cuenta !== false));
    }).length;

    var msg = (tipo === "ml" ? "Export de Mercado Libre" : "Planilla editada") + "\n\n" +
      "· " + cambiadas + " publicaciones con cambios\n" +
      "· " + agregadas + " nuevas\n" +
      "· " + quitadas.length + " que ya no están (se eliminan)\n\n" +
      "¿Aplico estos cambios? Después vas a tener que apretar Guardar.";
    if(!confirm(msg)) return;

    state.rows = nuevas;
    markDirty();
    render();
    toast("Datos cargados. Revisalos y apretá Guardar.");
  }

  var tId;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.className = "show";
    clearTimeout(tId); tId = setTimeout(function(){ t.className = ""; }, 2600);
  }

  /* ---------- eventos ---------- */
  ["q","fEstado","fZero","fMulti","fRev"].forEach(function(id){
    document.getElementById(id).addEventListener("input", render);
  });
  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){
      vista = b.dataset.vista;
      document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === b); });
      // los filtros de publicaciones no aplican a la vista por SKU
      document.querySelectorAll(".chk, #fEstado, #btnToggle, #btnAddSku")
        .forEach(function(x){ x.style.display = vista === "sku" ? "none" : ""; });
      render();
    });
  });
  document.getElementById("btnSave").addEventListener("click", save);
  document.getElementById("btnXlsx").addEventListener("click", bajarExcel);
  document.getElementById("btnCargar").addEventListener("click", function(){
    document.getElementById("fileXlsx").click();
  });
  document.getElementById("fileXlsx").addEventListener("change", function(){
    if(this.files[0]) cargarExcel(this.files[0]);
    this.value = "";                       // permite volver a subir el mismo archivo
  });
  document.getElementById("btnAddSku").addEventListener("click", addSku);
  document.getElementById("btnAddSku2").addEventListener("click", addSku);
  document.getElementById("btnToggle").addEventListener("click", function(){
    allCollapsed = !allCollapsed;
    collapsed = {};
    if(allCollapsed) bySku(state.rows).forEach(function(g){ collapsed[g.sku] = true; });
    this.textContent = allCollapsed ? "Expandir todo" : "Contraer todo";
    render();
  });
  document.addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); }
  });
  window.addEventListener("beforeunload", function(e){
    if(dirty){ e.preventDefault(); e.returnValue = ""; }
  });

  // el encabezado de la tabla se pega justo debajo de la barra superior, mida lo que mida
  function stickTop(){
    document.documentElement.style.setProperty(
      "--th-top", document.querySelector("header").offsetHeight + "px");
  }
  window.addEventListener("resize", stickTop);

  /* ---------- login ---------- */
  // Los datos no están en el HTML: vienen del servidor y el servidor pide la clave.
  // Por eso esto no es un cartel decorativo — sin clave no hay planilla.
  function entrar(){
    var err = document.getElementById("loginErr");
    err.textContent = "";
    return traer(true).then(function(){
      if(modo !== "servidor") throw new Error("sin servidor");
      document.getElementById("login").hidden = true;
      document.body.classList.remove("locked");
      stickTop();
      setInterval(function(){ traer().catch(function(){}); }, 30000);
    });
  }

  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var campo = document.getElementById("pass"), err = document.getElementById("loginErr");
    var btn = document.getElementById("btnEntrar");
    if(!campo.value){ err.textContent = "Escribí la clave"; return; }
    try{ localStorage.setItem(PASS_KEY, campo.value); }catch(e2){}
    btn.disabled = true; btn.textContent = "Entrando…";
    entrar().catch(function(){
      try{ localStorage.removeItem(PASS_KEY); }catch(e2){}
      err.textContent = malaClave ? "Clave incorrecta" : "No se pudo conectar con el servidor";
      campo.value = ""; campo.focus();
    }).then(function(){
      btn.disabled = false; btn.textContent = "Entrar";
    });
  });

  /* ---------- arranque ---------- */
  stickTop();
  state = load();
  render();
  // si ya se entró antes en este navegador, no vuelve a pedir la clave
  if(localStorage.getItem(PASS_KEY)) entrar().catch(function(){});
})();
</script>
